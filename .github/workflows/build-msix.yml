name: Build and Package

# Nothing built here is published, anywhere. Drive for Immich is a paid app in a public repo,
# and an Actions artifact on a public repo needs only read access to download, which is
# everyone. Handing out an unpackaged build instead is not an option either: the Cloud Files
# sync root and the IThumbnailProvider COM server are registered only by
# ImmichDriveMSIX/Package.appxmanifest (com:ExeServer + desktop3:CloudFiles), so without
# package identity there is no working product to give away. The install route is the
# Microsoft Store (https://apps.microsoft.com/detail/9MWC6165N7DH); anyone who wants to run it
# from source builds it themselves, which the repo has everything for.
#
# The Store package is produced locally, not here: .\ImmichDriveMSIX\build-msix.ps1 -NoSign
# keeps the real Partner Center identity and leaves it unsigned for the Store to re-sign at
# ingestion. So this workflow exists for two things only: the build check below, and a
# notes-only GitHub release on a tag.

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

jobs:
  build:
    runs-on: windows-2025

    strategy:
      matrix:
        platform: [x64, ARM64]

    env:
      PLATFORM: ${{ matrix.platform }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: true

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      # -- Extract version from Directory.Build.props --------------
      - name: Read version
        id: version
        shell: pwsh
        run: |
          [xml]$props = Get-Content Directory.Build.props
          $ver = $props.Project.PropertyGroup[0].Version
          echo "VERSION=$ver" >> $env:GITHUB_OUTPUT
          Write-Host "Detected version: $ver"

      # -- Generate MSIX visual assets -----------------------------
      - name: Generate images
        shell: pwsh
        run: ./ImmichDriveMSIX/generate-msix-images.ps1

      # -- Build the MSIX package ----------------------------------
      # This build produces no downloadable output on purpose, and it is still the point of the
      # job: it is the only automated check that manifest stamping, makepri, makeappx and
      # signing all still work. Delete it and the next break in the packaging pipeline surfaces
      # during a Store submission instead of on the commit that caused it. Keep it.
      #
      # Signs with a CA-trusted certificate when these repository secrets exist:
      #   CODESIGN_PFX_BASE64   - base64-encoded PFX certificate file
      #   CODESIGN_PFX_PASSWORD - password for the PFX certificate
      # Otherwise a self-signed dev certificate is used (install requires trusting it).
      - name: Build MSIX
        shell: pwsh
        env:
          CODESIGN_PFX_BASE64: ${{ secrets.CODESIGN_PFX_BASE64 }}
          CODESIGN_PFX_PASSWORD: ${{ secrets.CODESIGN_PFX_PASSWORD }}
        run: |
          $script = "ImmichDriveMSIX/build-msix.ps1"
          if (-not [string]::IsNullOrEmpty($env:CODESIGN_PFX_BASE64)) {
            $pfx = Join-Path $env:RUNNER_TEMP "codesign.pfx"
            [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:CODESIGN_PFX_BASE64))
            & $script -Platform $env:PLATFORM -TrustedPfxPath $pfx -TrustedPfxPassword $env:CODESIGN_PFX_PASSWORD
            Remove-Item $pfx -Force
          } else {
            Write-Host "No CODESIGN_PFX_BASE64 secret - using a self-signed dev certificate." -ForegroundColor Yellow
            & $script -Platform $env:PLATFORM
          }
          if ($LASTEXITCODE -ne 0) { Write-Error "build-msix failed"; exit 1 }

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    # No artifact passes between the jobs any more, but the dependency stays: a tag should not
    # get a release if the package it names does not build.
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout (for git log)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Generate release notes from commits
        id: notes
        run: |
          CURRENT_TAG="${GITHUB_REF#refs/tags/}"
          PREVIOUS_TAG=$(git tag --sort=-v:refname | grep -E '^v' | sed -n '2p')
          if [ -n "$PREVIOUS_TAG" ]; then RANGE="${PREVIOUS_TAG}..${CURRENT_TAG}"; else RANGE="${CURRENT_TAG}"; fi
          BODY=$(git log "$RANGE" --pretty=format:"- %s" --no-merges \
            | grep -vi "^- Bump version" | grep -vi "^- Merge branch")
          if [ -z "$BODY" ]; then BODY="- Maintenance release (no notable changes)"; fi
          {
            echo "RELEASE_BODY<<RELEASE_EOF"
            echo "## What's Changed"
            echo ""
            echo "$BODY"
            echo ""
            echo "## Install"
            echo ""
            echo "Drive for Immich installs from the [Microsoft Store](https://apps.microsoft.com/detail/9MWC6165N7DH)."
            echo "Releases here carry notes only. The app registers its Cloud Files sync root and its"
            echo "thumbnail handler from the package manifest, so it needs package identity to work and"
            echo "there is no standalone build worth downloading. Building from source works: see"
            echo "DEVELOPMENT.md."
            echo "RELEASE_EOF"
          } >> "$GITHUB_OUTPUT"

      # Notes and the tag, no assets. See the comment at the top of this file for why nothing
      # binary is published from here.
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          body: ${{ steps.notes.outputs.RELEASE_BODY }}
          generate_release_notes: true
