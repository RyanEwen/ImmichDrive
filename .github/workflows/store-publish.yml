name: Publish to Microsoft Store

# Tags submit both architectures directly to Partner Center at the verified US $0.99 tier.
# Manual runs default to draft-only review. Never expose paid MSIX files as artifacts.
# The published submission reports Base; CLI 0.4.3 needs Tier1012 for this product.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      no_commit:
        description: 'Stage a draft for review in Partner Center without submitting'
        type: boolean
        default: true
      repair_draft:
        description: 'Existing draft ID to repair with both architectures; requires no_commit'
        type: string
        default: ''
      replace_canceled_draft:
        description: 'Exact canceled tier submission ID to replace with a corrected release'
        type: string
        default: ''
      resume_draft:
        description: 'Exact uploaded draft ID to submit after a release-note or commit failure'
        type: string
        default: ''

permissions:
  contents: read

concurrency:
  group: store-package
  cancel-in-progress: false

jobs:
  publish:
    if: inputs.resume_draft == ''
    runs-on: windows-2025

    steps:
      - name: Check publishing credentials
        shell: pwsh
        env:
          AZURE_AD_TENANT_ID: ${{ secrets.AZURE_AD_TENANT_ID }}
          SELLER_ID: ${{ secrets.SELLER_ID }}
          AZURE_AD_APPLICATION_CLIENT_ID: ${{ secrets.AZURE_AD_APPLICATION_CLIENT_ID }}
          AZURE_AD_APPLICATION_SECRET: ${{ secrets.AZURE_AD_APPLICATION_SECRET }}
        run: |
          foreach ($name in @('AZURE_AD_TENANT_ID', 'SELLER_ID', 'AZURE_AD_APPLICATION_CLIENT_ID', 'AZURE_AD_APPLICATION_SECRET')) {
            if ([string]::IsNullOrWhiteSpace([Environment]::GetEnvironmentVariable($name))) {
              throw "Missing GitHub Actions secret: $name"
            }
          }

      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: true

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Check release notes
        shell: pwsh
        run: |
          [xml]$props = Get-Content Directory.Build.props
          $version = $props.SelectSingleNode('//Version').InnerText
          $notes = (Get-Content "release-notes/$version.txt" -Raw).Trim()
          if ([string]::IsNullOrWhiteSpace($notes) -or $notes.Length -gt 1500) { throw 'Missing or invalid release notes.' }
          & ./.github/scripts/tests/set-store-release-notes.Tests.ps1

      - name: Generate images
        shell: pwsh
        run: |
          & "$env:GITHUB_WORKSPACE/ImmichDriveMSIX/generate-msix-images.ps1"
          if (-not $?) { throw 'Image generation failed' }

      - name: Build MSIX packages (x64 + ARM64, unsigned for Store)
        shell: pwsh
        run: |
          foreach ($plat in @('x64', 'ARM64')) {
            Write-Host "::group::Build $plat MSIX"
            & "$env:GITHUB_WORKSPACE\ImmichDriveMSIX\build-msix.ps1" -Platform $plat -NoSign
            if ($LASTEXITCODE -ne 0) { throw "build-msix.ps1 failed for $plat (exit $LASTEXITCODE)" }
            Write-Host "::endgroup::"
          }

      # Keep paid Store packages on this runner; never upload public Actions artifacts.
      - name: Bundle Store packages
        shell: pwsh
        run: |
          [xml]$props = Get-Content "$env:GITHUB_WORKSPACE/Directory.Build.props"
          $version = $props.SelectSingleNode("//Version").InnerText
          $out = "$env:GITHUB_WORKSPACE/ImmichDriveMSIX/bin/msix-output"
          & "$env:GITHUB_WORKSPACE/.github/scripts/build-store-upload.ps1" -AppName ImmichDrive -OutputDirectory $out -Version $version

      - name: Setup Microsoft Store CLI
        uses: microsoft/microsoft-store-apppublisher@v1.1
        with:
          version: 'v0.4.3'

      - name: Remove selected canceled Store submission
        if: inputs.replace_canceled_draft != ''
        shell: pwsh
        env:
          SUBMISSION_ID: ${{ inputs.replace_canceled_draft }}
          REPAIR_DRAFT: ${{ inputs.repair_draft }}
          NO_COMMIT: ${{ inputs.no_commit }}
          AZURE_AD_TENANT_ID: ${{ secrets.AZURE_AD_TENANT_ID }}
          AZURE_AD_APPLICATION_CLIENT_ID: ${{ secrets.AZURE_AD_APPLICATION_CLIENT_ID }}
          AZURE_AD_APPLICATION_SECRET: ${{ secrets.AZURE_AD_APPLICATION_SECRET }}
        run: |
          if ($env:REPAIR_DRAFT) { throw 'Choose repair_draft or replace_canceled_draft, not both.' }
          if ($env:NO_COMMIT -ne 'false') { throw 'Replacing a canceled release requires a committed submission.' }
          & ./.github/scripts/replace-canceled-store-draft.ps1 -AppId 9MWC6165N7DH -SubmissionId $env:SUBMISSION_ID -PriceId Tier1012

      - name: Configure Store credentials
        if: inputs.repair_draft == ''
        shell: pwsh
        env:
          AZURE_AD_TENANT_ID: ${{ secrets.AZURE_AD_TENANT_ID }}
          SELLER_ID: ${{ secrets.SELLER_ID }}
          AZURE_AD_APPLICATION_CLIENT_ID: ${{ secrets.AZURE_AD_APPLICATION_CLIENT_ID }}
          AZURE_AD_APPLICATION_SECRET: ${{ secrets.AZURE_AD_APPLICATION_SECRET }}
        run: |
          msstore reconfigure --tenantId "$env:AZURE_AD_TENANT_ID" --sellerId "$env:SELLER_ID" --clientId "$env:AZURE_AD_APPLICATION_CLIENT_ID" --clientSecret "$env:AZURE_AD_APPLICATION_SECRET"
          if ($LASTEXITCODE -ne 0) { throw "Store authentication configuration failed (exit $LASTEXITCODE)" }
          # The CLI deletes pending submissions before publishing. Preserve any existing draft.
          $token = Invoke-RestMethod -Method Post -Uri "https://login.microsoftonline.com/$env:AZURE_AD_TENANT_ID/oauth2/token" -Body @{
            grant_type = 'client_credentials'
            client_id = $env:AZURE_AD_APPLICATION_CLIENT_ID
            client_secret = $env:AZURE_AD_APPLICATION_SECRET
            resource = 'https://manage.devcenter.microsoft.com'
          }
          $app = Invoke-RestMethod -Uri 'https://manage.devcenter.microsoft.com/v1.0/my/applications/9MWC6165N7DH' -Headers @{ Authorization = "Bearer $($token.access_token)" }
          if ($null -ne $app.pendingApplicationSubmission) {
            throw 'An existing Store submission is pending. Review it in Partner Center before starting another run.'
          }

      - name: Publish to Microsoft Store
        if: inputs.repair_draft == ''
        shell: pwsh
        env:
          NO_COMMIT: ${{ github.event_name == 'workflow_dispatch' && inputs.no_commit }}
          AZURE_AD_TENANT_ID: ${{ secrets.AZURE_AD_TENANT_ID }}
          AZURE_AD_APPLICATION_CLIENT_ID: ${{ secrets.AZURE_AD_APPLICATION_CLIENT_ID }}
          AZURE_AD_APPLICATION_SECRET: ${{ secrets.AZURE_AD_APPLICATION_SECRET }}
        run: |
          [xml]$props = Get-Content "$env:GITHUB_WORKSPACE/Directory.Build.props"
          $version = $props.SelectSingleNode("//Version").InnerText
          $publishArgs = @('publish', "$env:GITHUB_WORKSPACE/ImmichDriveMSIX/bin/msix-output/ImmichDrive-$version.msixupload", '-id', '9MWC6165N7DH')
          # Stage first so release notes are saved and verified before certification begins.
          $publishArgs += '--noCommit'
          # Tier1012 maps to US $0.99; regional prices can change when the tier is applied.
          $publishArgs += @('--priceId', 'Tier1012')
          & msstore @publishArgs
          if ($LASTEXITCODE -ne 0) {
            throw "Store publishing failed (exit $LASTEXITCODE). Review the submission in Partner Center."
          }
          & ./.github/scripts/set-store-release-notes.ps1 -AppId 9MWC6165N7DH -UploadFileName "ImmichDrive-$version.msixupload" -NotesPath "release-notes/$version.txt" -Commit:($env:NO_COMMIT -ne 'true')
          if ($env:NO_COMMIT -eq 'true') {
            'Store draft uploaded. Review pricing and packages in Partner Center before committing.' >> $env:GITHUB_STEP_SUMMARY
          } else {
            'Store submission committed. Publication depends on Microsoft certification and the submission publishing settings.' >> $env:GITHUB_STEP_SUMMARY
          }

      - name: Repair existing Store draft
        if: inputs.repair_draft != ''
        shell: pwsh
        env:
          SUBMISSION_ID: ${{ inputs.repair_draft }}
          NO_COMMIT: ${{ inputs.no_commit }}
          AZURE_AD_TENANT_ID: ${{ secrets.AZURE_AD_TENANT_ID }}
          AZURE_AD_APPLICATION_CLIENT_ID: ${{ secrets.AZURE_AD_APPLICATION_CLIENT_ID }}
          AZURE_AD_APPLICATION_SECRET: ${{ secrets.AZURE_AD_APPLICATION_SECRET }}
        run: |
          if ($env:NO_COMMIT -ne 'true') { throw 'Repairing a draft requires no_commit.' }
          [xml]$props = Get-Content "$env:GITHUB_WORKSPACE/Directory.Build.props"
          $version = $props.SelectSingleNode("//Version").InnerText
          & ./.github/scripts/repair-store-draft.ps1 -AppId 9MWC6165N7DH -SubmissionId $env:SUBMISSION_ID -PriceId Tier1012 -UploadPath "$env:GITHUB_WORKSPACE/ImmichDriveMSIX/bin/msix-output/ImmichDrive-$version.msixupload"

  resume:
    if: inputs.resume_draft != ''
    runs-on: windows-2025
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Verify and submit the selected uploaded draft
        shell: pwsh
        env:
          SUBMISSION_ID: ${{ inputs.resume_draft }}
          NO_COMMIT: ${{ inputs.no_commit }}
          REPAIR_DRAFT: ${{ inputs.repair_draft }}
          REPLACE_DRAFT: ${{ inputs.replace_canceled_draft }}
          AZURE_AD_TENANT_ID: ${{ secrets.AZURE_AD_TENANT_ID }}
          AZURE_AD_APPLICATION_CLIENT_ID: ${{ secrets.AZURE_AD_APPLICATION_CLIENT_ID }}
          AZURE_AD_APPLICATION_SECRET: ${{ secrets.AZURE_AD_APPLICATION_SECRET }}
        run: |
          if ($env:NO_COMMIT -ne 'false' -or $env:REPAIR_DRAFT -or $env:REPLACE_DRAFT) {
            throw 'Resuming requires no_commit=false without other repair options.'
          }
          [xml]$props = Get-Content Directory.Build.props
          $version = $props.SelectSingleNode('//Version').InnerText
          & ./.github/scripts/set-store-release-notes.ps1 -AppId 9MWC6165N7DH -ExpectedSubmissionId $env:SUBMISSION_ID -UploadFileName "ImmichDrive-$version.msixupload" -NotesPath "release-notes/$version.txt" -Commit
